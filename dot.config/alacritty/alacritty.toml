[general]
import = ["~/.config/alacritty/themes/nightfox.toml"]

[env]
TERM = "xterm-256color"

[font]
size = 12
normal.family = "JetBrainsMono Nerd Font"
offset.y = -1

[window]
decorations = "buttonless" # macOS-only; other platforms fall back to default
decorations_theme_variant = "Dark"
dimensions = { columns = 140, lines = 45 }
option_as_alt = "Both" # macOS-only; ignored elsewhere
padding = { x = 8, y = 8 }

# tmux: Ctrl+1..5 → send prefix (Ctrl+a) then the digit
[keyboard]
bindings = [
  { key = "Key1", mods = "Control", chars = "\u00011" },
  { key = "Key2", mods = "Control", chars = "\u00012" },
  { key = "Key3", mods = "Control", chars = "\u00013" },
  { key = "Key4", mods = "Control", chars = "\u00014" },
  { key = "Key5", mods = "Control", chars = "\u00015" },
  { key = "Return", mods = "Command", action = "ToggleFullscreen" },
]
